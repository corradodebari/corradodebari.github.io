  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    const mdUrl = "https://raw.githubusercontent.com/corradodebari/corradodebari.github.io/refs/heads/main/privare-ai.md";

    // Insert copy buttons into each code block
    function addCopyButtons(root) {
      root.querySelectorAll('pre').forEach(pre => {
        // avoid duplicates
        if (pre.querySelector('.copy-btn')) return;
        const btn = document.createElement('button');
        btn.className = 'copy-btn';
        btn.textContent = 'Copy';
        btn.addEventListener('click', async () => {
          const code = pre.querySelector('code').innerText;
          try {
            await navigator.clipboard.writeText(code);
            btn.textContent = 'Copied!';
            setTimeout(() => btn.textContent = 'Copy', 1500);
          } catch (err) {
            btn.textContent = 'Error';
            setTimeout(() => btn.textContent = 'Copy', 1500);
          }
        });
        pre.appendChild(btn);
      });
    }

    fetch(mdUrl)
      .then(r => { if (!r.ok) throw new Error(r.statusText); return r.text(); })
      .then(md => {
        const html = marked.parse(md);
        const content = document.getElementById("content");
        content.innerHTML = html;
        addCopyButtons(content);
      })
      .catch(err => {
        document.getElementById("content").textContent = "Could not load Markdown: " + err;
      });
  </script>
