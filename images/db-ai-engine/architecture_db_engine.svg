<text class="small" x="500" y="327" text-anchor="middle">REST</text>
<text class="small" x="750" y="258" text-anchor="middle">Container network · http://private-ai:8080</text>
<rect x="40" y="290" width="420" height="135" rx="12" fill="#E7F1FB" stroke="#91B6DC"/>
<text class="head" x="250" y="320" text-anchor="middle">Oracle AI Database 26ai</text>
<text class="detail" x="250" y="350" text-anchor="middle">DBMS_AI_AGENT · model/tool loop</text>
<text class="detail" x="250" y="376" text-anchor="middle">PRODUCT_CATALOG_SEARCH procedure</text>
<text class="detail" x="250" y="402" text-anchor="middle">product_catalog · vectors + cosine ranking</text>
