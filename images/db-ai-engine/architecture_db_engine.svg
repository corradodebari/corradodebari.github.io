<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
<title id="title">Python SDK authoring and Oracle AI Database Agent Engine execution</title>
<desc id="desc">Python defines the agent with oracle-db-agent-sdk and submits it to DBMS_AI_AGENT. Oracle Database executes the agent and stored search procedure, stores vectors, and calls the Private AI models over the container network.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#3D5168"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;fill:#16283B}.title{font-size:26px;font-weight:700}.subtitle{font-size:16px;fill:#455A70}.head{font-size:18px;font-weight:650}.detail{font-size:16px;fill:#344D64}.small{font-size:14px;fill:#405871}.arrow{fill:none;stroke:#3D5168;stroke-width:2;marker-end:url(#arrow)}</style>
<rect x="0.5" y="0.5" width="999" height="479" rx="17" fill="#F8FAFD" stroke="#D7E1EC"/>
