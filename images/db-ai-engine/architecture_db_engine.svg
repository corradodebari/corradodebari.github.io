<text class="head" x="750" y="320" text-anchor="middle">Private AI Services Container</text>
<text class="detail" x="750" y="350" text-anchor="middle">Ministral 3B · /v1/chat/completions</text>
<text class="detail" x="750" y="376" text-anchor="middle">E5 base · /v1/embeddings</text>
<text class="detail" x="750" y="402" text-anchor="middle">Models included in the image</text>
<text class="small" x="500" y="456" text-anchor="middle">The SDK submits Agent Spec. The database coordinates model calls and executes the tool.</text>
