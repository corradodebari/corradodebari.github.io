<svg xmlns="http://www.w3.org/2000/svg" width="660" height="500"
     viewBox="0 0 330 250" role="img" aria-labelledby="title desc"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
     font-weight="400" fill="#1a1c1f">
  <title id="title">Create and store catalog embeddings</title>
  <desc id="desc">Product name, the first 400 description characters, and category
    are prefixed with passage:. Oracle Database calls the bundled multilingual-e5-base
    model in Private AI through DBMS_VECTOR_CHAIN.UTL_TO_EMBEDDING. The returned
    768-dimensional vector is stored in product_catalog.embedding as VECTOR(768, FLOAT32).
    The colored cells illustrate vector components.</desc>

  <rect width="330" height="250" rx="6" fill="#ffffff"/>

  <!-- Catalog text prepared by Python during catalog setup. -->
  <rect x="10" y="8" width="310" height="42" rx="5"
        fill="#f0f1f3" stroke="#64748b"/>
  <text x="165" y="26" font-size="11" text-anchor="middle">Product name + description + category</text>
  <text x="165" y="42" font-size="10" text-anchor="middle">Text prefix: passage:</text>
  <path d="M165 50V64M161 59L165 64L169 59" stroke="#1a1c1f" fill="none"/>

  <!-- The database invokes Private AI through Vector Chain. -->
  <rect x="30" y="66" width="270" height="42" rx="5"
        fill="#edf4fb" stroke="#3074b1"/>
  <text x="165" y="82" font-size="10" text-anchor="middle">Oracle Database</text>
  <text x="165" y="98" font-size="10" text-anchor="middle"
        font-family="'SFMono-Regular', Consolas, monospace">DBMS_VECTOR_CHAIN.UTL_TO_EMBEDDING</text>
  <path d="M165 108V122M161 117L165 122L169 117" stroke="#1a1c1f" fill="none"/>

  <rect x="55" y="124" width="220" height="42" rx="5"
        stroke="#e58c17" fill="#fdf5e8"/>
  <text x="165" y="141" font-size="12" font-weight="700"
        text-anchor="middle">multilingual-e5-base</text>
  <text x="165" y="157" font-size="10" text-anchor="middle">Private AI · /v1/embeddings</text>
  <path d="M165 166V182M161 177L165 182L169 177" stroke="#1a1c1f" fill="none"/>

  <!-- Illustrative components; the actual vector has 768 dimensions. -->
  <g fill="#3074b1" aria-hidden="true">
    <rect x="17" y="185" width="9.5" height="18" rx="1.5" opacity=".20"/>
    <rect x="29.5" y="185" width="9.5" height="18" rx="1.5" opacity=".78"/>
    <rect x="42" y="185" width="9.5" height="18" rx="1.5" opacity=".53"/>
    <rect x="54.5" y="185" width="9.5" height="18" rx="1.5" opacity=".28"/>
    <rect x="67" y="185" width="9.5" height="18" rx="1.5" opacity=".87"/>
    <rect x="79.5" y="185" width="9.5" height="18" rx="1.5" opacity=".62"/>
    <rect x="92" y="185" width="9.5" height="18" rx="1.5" opacity=".37"/>
    <rect x="104.5" y="185" width="9.5" height="18" rx="1.5" opacity=".95"/>
    <rect x="117" y="185" width="9.5" height="18" rx="1.5" opacity=".70"/>
    <rect x="129.5" y="185" width="9.5" height="18" rx="1.5" opacity=".45"/>
    <rect x="142" y="185" width="9.5" height="18" rx="1.5" opacity=".20"/>
    <rect x="154.5" y="185" width="9.5" height="18" rx="1.5" opacity=".78"/>
    <rect x="167" y="185" width="9.5" height="18" rx="1.5" opacity=".53"/>
    <rect x="179.5" y="185" width="9.5" height="18" rx="1.5" opacity=".28"/>
    <rect x="192" y="185" width="9.5" height="18" rx="1.5" opacity=".87"/>
    <rect x="204.5" y="185" width="9.5" height="18" rx="1.5" opacity=".62"/>
    <rect x="217" y="185" width="9.5" height="18" rx="1.5" opacity=".37"/>
    <rect x="229.5" y="185" width="9.5" height="18" rx="1.5" opacity=".95"/>
    <rect x="242" y="185" width="9.5" height="18" rx="1.5" opacity=".70"/>
    <rect x="254.5" y="185" width="9.5" height="18" rx="1.5" opacity=".45"/>
    <rect x="267" y="185" width="9.5" height="18" rx="1.5" opacity=".20"/>
    <rect x="279.5" y="185" width="9.5" height="18" rx="1.5" opacity=".78"/>
    <rect x="292" y="185" width="9.5" height="18" rx="1.5" opacity=".53"/>
    <rect x="304.5" y="185" width="9.5" height="18" rx="1.5" opacity=".28"/>
  </g>
  <text x="165" y="220" font-size="11" text-anchor="middle">Stored in product_catalog.embedding</text>
  <text x="165" y="237" font-size="10" text-anchor="middle">Oracle Database · VECTOR(768, FLOAT32)</text>
</svg>
