<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="335" viewBox="0 0 1000 335" role="img" aria-labelledby="title desc">
<title id="title">One embedding model for indexing and retrieval</title><desc id="desc">The same bundled E5 base ONNX model encodes catalog text prefixed with passage and user text prefixed with query. Oracle stores catalog vectors and uses query vectors for exact search.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#3D5168"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;fill:#16283B}.title{font-size:27px;font-weight:720}.subtitle{font-size:16px;fill:#455A70}.group{font-size:17px;font-weight:700}.head{font-size:17px;font-weight:680}.detail{font-size:15px;fill:#344D64}.small{font-size:13px;fill:#405871}.arrow{fill:none;stroke:#3D5168;stroke-width:2;marker-end:url(#arrow)}.return{stroke-dasharray:6 5}</style>
<rect x="0.5" y="0.5" width="999" height="334" rx="17" fill="#F8FAFD" stroke="#D7E1EC"/>
<text class="title" x="32" y="46">One embedding model for indexing and retrieval</text>
<text class="subtitle" x="32" y="75">Oracle calls the same E5 model through DBMS_VECTOR_CHAIN.UTL_TO_EMBEDDING.</text>
<rect x="32" y="111" width="257" height="71" rx="10" fill="#E7F1FB" stroke="#91B6DC"/>
<text class="head" x="160.5" y="132.5" text-anchor="middle">Catalog record</text>
<text class="detail" x="160.5" y="152.5" text-anchor="middle">passage: name + description</text>
<text class="detail" x="160.5" y="171.5" text-anchor="middle">+ category</text>
<rect x="32" y="220" width="257" height="71" rx="10" fill="#E7F1FB" stroke="#91B6DC"/>
<text class="head" x="160.5" y="251.5" text-anchor="middle">User request</text>
<text class="detail" x="160.5" y="271.5" text-anchor="middle">query: original-language text</text>
<rect x="363" y="150" width="265" height="98" rx="10" fill="#E6F5F0" stroke="#75B8A5"/>
<text class="head" x="495.5" y="185" text-anchor="middle">Multilingual E5 base</text>
<text class="detail" x="495.5" y="205" text-anchor="middle">Private AI /v1/embeddings</text>
<text class="detail" x="495.5" y="225" text-anchor="middle">768-dimensional FLOAT32</text>
<rect x="708" y="111" width="260" height="71" rx="10" fill="#FFFFFF" stroke="#CBD8E5"/>
<text class="head" x="838" y="142.5" text-anchor="middle">Stored product vectors</text>
<text class="detail" x="838" y="162.5" text-anchor="middle">PRODUCT_CATALOG.EMBEDDING</text>
<rect x="708" y="220" width="260" height="71" rx="10" fill="#FFFFFF" stroke="#CBD8E5"/>
<text class="head" x="838" y="251.5" text-anchor="middle">Transient query vector</text>
<text class="detail" x="838" y="271.5" text-anchor="middle">Exact cosine distance in Oracle</text>
<path class="arrow" d="M289 147 H331 V175 H363"/>
<path class="arrow" d="M289 254 H331 V225 H363"/>
<path class="arrow" d="M628 175 H669 V147 H708"/>
<path class="arrow" d="M628 225 H669 V254 H708"/>
</svg>
